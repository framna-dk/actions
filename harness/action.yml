name: "Banzai harness"
description: "Runs a Codex agent against one tracker issue inside a GitHub Actions job."

inputs:
  github_project_board:
    description: "Projects v2 board as its URL-path key, e.g. orgs/framna-dk/projects/23 (org or user). The node ID for writes is resolved from this."
    required: true
  issue_number:
    description: "Issue number within its repo (e.g. 12)."
    required: true
  attempt:
    description: "Dispatch attempt counter from the orchestrator (0 for the first run)."
    required: true
  prompt_path:
    description: "Path to the Liquid prompt template (relative to the workspace repo, or absolute). Required; there is no built-in default prompt."
    required: true
  workspace_root:
    description: "Directory under which per-issue workspaces are created."
    required: false
    default: "$HOME/banzai-workspaces"
  repo_url:
    description: "Override the git URL for the workspace clone (defaults to current repo)."
    required: false
    default: ""
  base_branch:
    description: "Branch the workspace resets from on each run; the agent's working branch is cut from it."
    required: false
    default: "main"
  log_level:
    description: "info | warn | error"
    required: false
    default: "info"

runs:
  using: composite
  steps:
    # The implementation is the `banzai-harness` CLI (repo:
    # framna-dk/banzai-codes-harness), a runner prerequisite on PATH. Non-secret
    # inputs are explicit flags; secrets (GH_TOKEN, OPENAI_API_KEY) are read from
    # the environment only.
    - name: harness-preflight
      shell: bash
      run: >-
        banzai-harness preflight
        --github-project-board "${{ inputs.github_project_board }}"
        --issue-number "${{ inputs.issue_number }}"
        --attempt "${{ inputs.attempt }}"
        --prompt-path "${{ inputs.prompt_path }}"
        --log-level "${{ inputs.log_level }}"
    - name: harness-run
      shell: bash
      run: >-
        banzai-harness run
        --github-project-board "${{ inputs.github_project_board }}"
        --issue-number "${{ inputs.issue_number }}"
        --attempt "${{ inputs.attempt }}"
        --prompt-path "${{ inputs.prompt_path }}"
        --log-level "${{ inputs.log_level }}"
        --repo-url "${{ inputs.repo_url }}"
        --workspace-root "${{ inputs.workspace_root }}"
        --base-branch "${{ inputs.base_branch }}"
        --runner-temp "${{ runner.temp }}"
