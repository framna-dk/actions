name: "Banzai harness"
description: "Runs a Codex agent against one tracker issue inside a GitHub Actions job."

inputs:
  issue_number:
    description: "Issue number within its repo (e.g. 12)."
    required: true
  attempt:
    description: "Dispatch attempt counter from the orchestrator (0 for the first run)."
    required: true
  tracker_kind:
    description: "Always 'github_projects_v2' for now."
    required: true
  project_owner:
    description: "Projects v2 owner login (org or user), e.g. framna-dk."
    required: true
  project_number:
    description: "Projects v2 board number, e.g. 23."
    required: true
  project_node_id:
    description: "Projects v2 node ID (e.g. PVT_kw...). Used for `gh project item-edit`."
    required: true
  prompt_path:
    description: "Path to the Liquid prompt template (relative to the workspace repo, or absolute). Required; there is no built-in default prompt."
    required: true
  workspace_root:
    description: "Directory under which per-issue workspaces are created."
    required: false
    default: "$HOME/banzai-workspaces"
  repo_url:
    description: "Override the git URL for the workspace clone (defaults to current repo)."
    required: false
    default: ""
  base_branch:
    description: "Branch the workspace resets from on each run; the agent's working branch is cut from it."
    required: false
    default: "main"
  log_level:
    description: "info | warn | error"
    required: false
    default: "info"

runs:
  using: composite
  steps:
    - name: harness-preflight
      shell: bash
      env:
        HARNESS_INPUTS_JSON: ${{ toJson(inputs) }}
      run: node ${{ github.action_path }}/dist/preflight.js
    - name: harness-run
      shell: bash
      env:
        HARNESS_INPUTS_JSON: ${{ toJson(inputs) }}
      run: node ${{ github.action_path }}/dist/harness.js
