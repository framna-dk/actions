name: Banzai handoff work orders
description: Create linked harness issues for work orders that reached the handoff status on a GitHub Projects v2 board.

inputs:
  github-token:
    description: GitHub App installation token with org Projects read/write and Issues read/write on the work-order and target repositories.
    required: true
  work-order-project-owner:
    description: Organization login that owns the work-order project.
    required: true
  work-order-project-number:
    description: Work-order project number from the project URL.
    required: true
  work-order-status:
    description: Status option on the work-order board that triggers the handoff.
    required: false
    default: In Progress
  target-repository:
    description: Repository (owner/repo) in which harness issues are created.
    required: true
  harness-project-owner:
    description: Organization login that owns the harness project.
    required: true
  harness-project-number:
    description: Harness project number from the project URL.
    required: true
  harness-status:
    description: Initial status option set on newly created harness issues.
    required: false
    default: Todo
  status-field-name:
    description: Name of the single-select status field on both boards.
    required: false
    default: Status
  max-items:
    description: Maximum number of work orders acted on per scan.
    required: false
    default: "10"
  dry-run:
    description: Log intended changes without performing any mutation.
    required: false
    default: "false"

outputs:
  created-issue-urls:
    description: Newline-separated URLs of harness issues created by this run.
    value: ${{ steps.handoff.outputs.created_issue_urls }}
  created-count:
    description: Number of harness issues created by this run.
    value: ${{ steps.handoff.outputs.created_count }}
  repaired-count:
    description: Number of existing harness issues healed (re-added to the board or given their initial status).
    value: ${{ steps.handoff.outputs.repaired_count }}
  errors:
    description: Newline-separated per-work-order error summaries (empty on a clean run).
    value: ${{ steps.handoff.outputs.errors }}

runs:
  using: composite
  steps:
    - name: Hand off work orders
      id: handoff
      uses: actions/github-script@v8
      env:
        WORK_ORDER_PROJECT_OWNER: ${{ inputs.work-order-project-owner }}
        WORK_ORDER_PROJECT_NUMBER: ${{ inputs.work-order-project-number }}
        WORK_ORDER_STATUS: ${{ inputs.work-order-status }}
        TARGET_REPOSITORY: ${{ inputs.target-repository }}
        HARNESS_PROJECT_OWNER: ${{ inputs.harness-project-owner }}
        HARNESS_PROJECT_NUMBER: ${{ inputs.harness-project-number }}
        HARNESS_STATUS: ${{ inputs.harness-status }}
        STATUS_FIELD_NAME: ${{ inputs.status-field-name }}
        MAX_ITEMS: ${{ inputs.max-items }}
        DRY_RUN: ${{ inputs.dry-run }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const workOrderProjectOwner = process.env.WORK_ORDER_PROJECT_OWNER;
          const workOrderProjectNumber = Number(process.env.WORK_ORDER_PROJECT_NUMBER);
          const workOrderStatus = process.env.WORK_ORDER_STATUS || 'In Progress';
          const targetRepository = process.env.TARGET_REPOSITORY;
          const harnessProjectOwner = process.env.HARNESS_PROJECT_OWNER;
          const harnessProjectNumber = Number(process.env.HARNESS_PROJECT_NUMBER);
          const harnessStatus = process.env.HARNESS_STATUS || 'Todo';
          const statusFieldName = process.env.STATUS_FIELD_NAME || 'Status';
          const maxItems = Number(process.env.MAX_ITEMS || '10');
          const dryRun = (process.env.DRY_RUN || 'false').toLowerCase() === 'true';

          const [targetOwner, targetName] = (targetRepository || '').split('/');
          if (!targetOwner || !targetName) {
            core.setFailed(`target-repository must be "owner/repo", got "${targetRepository}".`);
            return;
          }
          if (!Number.isInteger(workOrderProjectNumber) || !Number.isInteger(harnessProjectNumber)) {
            core.setFailed('work-order-project-number and harness-project-number must be integers.');
            return;
          }

          const resolveProject = async (owner, number) => {
            const data = await github.graphql(
              `
                query($owner: String!, $number: Int!) {
                  organization(login: $owner) {
                    projectV2(number: $number) {
                      id
                      title
                      fields(first: 50) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options { id name }
                          }
                        }
                      }
                    }
                  }
                }
              `,
              { owner, number }
            );
            const project = data.organization && data.organization.projectV2;
            if (!project) {
              throw new Error(`Project ${number} not found for organization "${owner}" (user-owned projects are not supported).`);
            }
            return project;
          };

          const workOrderProject = await resolveProject(workOrderProjectOwner, workOrderProjectNumber);
          const harnessProject = await resolveProject(harnessProjectOwner, harnessProjectNumber);

          const harnessStatusField = harnessProject.fields.nodes.find(
            (field) => field && field.name === statusFieldName && Array.isArray(field.options)
          );
          if (!harnessStatusField) {
            core.setFailed(`Single-select field "${statusFieldName}" not found on harness project ${harnessProjectNumber}.`);
            return;
          }
          const harnessStatusOption = harnessStatusField.options.find((option) => option.name === harnessStatus);
          if (!harnessStatusOption) {
            const available = harnessStatusField.options.map((option) => option.name).join(', ');
            core.setFailed(`Status option "${harnessStatus}" not found on harness project ${harnessProjectNumber}. Available: ${available}.`);
            return;
          }

          const repoData = await github.graphql(
            `
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) { id }
              }
            `,
            { owner: targetOwner, name: targetName }
          );
          const targetRepositoryId = repoData.repository.id;

          const workOrders = [];
          let after = null;
          while (true) {
            const page = await github.graphql(
              `
                query($owner: String!, $number: Int!, $statusField: String!, $after: String) {
                  organization(login: $owner) {
                    projectV2(number: $number) {
                      items(first: 50, after: $after) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          fieldValueByName(name: $statusField) {
                            ... on ProjectV2ItemFieldSingleSelectValue { name }
                          }
                          content {
                            ... on Issue {
                              id
                              number
                              title
                              body
                              url
                              state
                              repository { nameWithOwner }
                              subIssues(first: 50) {
                                nodes {
                                  id
                                  number
                                  url
                                  repository { nameWithOwner }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `,
              {
                owner: workOrderProjectOwner,
                number: workOrderProjectNumber,
                statusField: statusFieldName,
                after,
              }
            );
            const items = page.organization.projectV2.items;
            for (const item of items.nodes) {
              const status = item.fieldValueByName && item.fieldValueByName.name;
              const issue = item.content;
              if (status === workOrderStatus && issue && issue.id && issue.state === 'OPEN') {
                workOrders.push(issue);
              }
            }
            if (!items.pageInfo.hasNextPage) break;
            after = items.pageInfo.endCursor;
          }
          core.info(`Found ${workOrders.length} work order(s) in "${workOrderStatus}" on project ${workOrderProjectNumber}.`);

          const findHarnessProjectItem = async (issueId) => {
            const data = await github.graphql(
              `
                query($id: ID!, $statusField: String!) {
                  node(id: $id) {
                    ... on Issue {
                      projectItems(first: 50, includeArchived: true) {
                        nodes {
                          id
                          project { id }
                          fieldValueByName(name: $statusField) {
                            ... on ProjectV2ItemFieldSingleSelectValue { name }
                          }
                        }
                      }
                    }
                  }
                }
              `,
              { id: issueId, statusField: statusFieldName }
            );
            const nodes = (data.node && data.node.projectItems && data.node.projectItems.nodes) || [];
            return nodes.find((node) => node.project && node.project.id === harnessProject.id) || null;
          };

          const addToHarnessBoard = async (issueId) => {
            const data = await github.graphql(
              `
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }
              `,
              { projectId: harnessProject.id, contentId: issueId }
            );
            return data.addProjectV2ItemById.item.id;
          };

          const setHarnessStatus = async (itemId) => {
            await github.graphql(
              `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }
                  ) {
                    projectV2Item { id }
                  }
                }
              `,
              {
                projectId: harnessProject.id,
                itemId,
                fieldId: harnessStatusField.id,
                optionId: harnessStatusOption.id,
              }
            );
          };

          const buildHarnessBody = (workOrder) => {
            const maxBodyLength = 60000;
            let body = workOrder.body || '';
            if (body.length > maxBodyLength) {
              body = `${body.slice(0, maxBodyLength)}\n\n…(truncated — the full requirements live on the work order)`;
            }
            return `${body}\n\n---\nWork order: ${workOrder.url}`;
          };

          const createdIssueUrls = [];
          const errors = [];
          let repairedCount = 0;
          let actedOn = 0;

          for (const workOrder of workOrders) {
            if (actedOn >= maxItems) {
              core.info(`Reached max-items (${maxItems}); remaining work orders are picked up by the next scan.`);
              break;
            }
            try {
              const existing = workOrder.subIssues.nodes.find(
                (subIssue) => subIssue.repository.nameWithOwner.toLowerCase() === targetRepository.toLowerCase()
              );

              if (!existing) {
                if (dryRun) {
                  core.info(`[dry-run] Would create a harness issue in ${targetRepository} for ${workOrder.url}, link it as a sub-issue, add it to project ${harnessProjectNumber} and set status "${harnessStatus}".`);
                  actedOn += 1;
                  continue;
                }
                const created = await github.graphql(
                  `
                    mutation($repositoryId: ID!, $title: String!, $body: String!) {
                      createIssue(input: { repositoryId: $repositoryId, title: $title, body: $body }) {
                        issue { id number url }
                      }
                    }
                  `,
                  {
                    repositoryId: targetRepositoryId,
                    title: workOrder.title,
                    body: buildHarnessBody(workOrder),
                  }
                );
                const harnessIssue = created.createIssue.issue;
                await github.graphql(
                  `
                    mutation($issueId: ID!, $subIssueId: ID!) {
                      addSubIssue(input: { issueId: $issueId, subIssueId: $subIssueId }) {
                        issue { id }
                      }
                    }
                  `,
                  { issueId: workOrder.id, subIssueId: harnessIssue.id }
                );
                const itemId = await addToHarnessBoard(harnessIssue.id);
                await setHarnessStatus(itemId);
                createdIssueUrls.push(harnessIssue.url);
                actedOn += 1;
                core.info(`Created ${harnessIssue.url} for ${workOrder.url} (status "${harnessStatus}").`);
                continue;
              }

              // Sub-issue already exists: converge board membership and status without
              // ever overwriting a status the orchestrator may have moved since.
              const projectItem = await findHarnessProjectItem(existing.id);
              if (!projectItem) {
                if (dryRun) {
                  core.info(`[dry-run] Would re-add ${existing.url} to project ${harnessProjectNumber} and set status "${harnessStatus}".`);
                } else {
                  const itemId = await addToHarnessBoard(existing.id);
                  await setHarnessStatus(itemId);
                  core.info(`Repaired ${existing.url}: re-added to the harness board with status "${harnessStatus}".`);
                }
                repairedCount += 1;
                actedOn += 1;
              } else if (!(projectItem.fieldValueByName && projectItem.fieldValueByName.name)) {
                if (dryRun) {
                  core.info(`[dry-run] Would set status "${harnessStatus}" on ${existing.url}.`);
                } else {
                  await setHarnessStatus(projectItem.id);
                  core.info(`Repaired ${existing.url}: set missing status "${harnessStatus}".`);
                }
                repairedCount += 1;
                actedOn += 1;
              }
            } catch (error) {
              const message = `${workOrder.url}: ${error.message}`;
              core.warning(message);
              errors.push(message);
            }
          }

          core.setOutput('created_issue_urls', createdIssueUrls.join('\n'));
          core.setOutput('created_count', String(createdIssueUrls.length));
          core.setOutput('repaired_count', String(repairedCount));
          core.setOutput('errors', errors.join('\n'));
          if (errors.length > 0) {
            core.setFailed(`Handoff failed for ${errors.length} work order(s):\n${errors.join('\n')}`);
          }
